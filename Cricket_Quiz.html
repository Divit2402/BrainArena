<!DOCTYPE html>
<html>
<head>
<title>Cricket Quiz</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:linear-gradient(to right,#0b5394,#1e90ff);
    margin:0;
    padding:30px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

h1{
    color:#0b5394;
}

.question{
    margin-top:25px;
    padding:15px;
    background:#eef7ff;
    border-left:6px solid #1e90ff;
    border-radius:8px;
}

label{
    display:block;
    margin:8px 0;
    cursor:pointer;
    font-size:18px;
}

button{
    display:block;
    width:100%;
    margin-top:30px;
    padding:15px;
    font-size:20px;
    background:#1e90ff;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0b5394;
    transform:scale(1.03);
}

#result{
    margin-top:25px;
    text-align:center;
    font-size:26px;
    font-weight:bold;
    color:#0b5394;
}
</style>

</head>

<body>

<div class="container">

<h1>🏏 Cricket Quiz 🏏</h1>

<form id="quiz">

<div class="question">
<h3>1. Suryakumar Yadav took a stunning catch of which player in the 2024 T20 World Cup Final?</h3>

<label><input type="radio" name="q1" value="Henrich Klaasen"> Henrich Klaasen</label>
<label><input type="radio" name="q1" value="David Miller"> David Miller</label>
<label><input type="radio" name="q1" value="Travis Head"> Travis Head</label>
<label><input type="radio" name="q1" value="Quinton de Kock"> Quinton de Kock</label>
</div>

<div class="question">
<h3>2. Which player scored the fastest hundred in the T20 World Cup 2026?</h3>

<label><input type="radio" name="q2" value="Ryan Rickelton"> Ryan Rickelton</label>
<label><input type="radio" name="q2" value="Aiden Markram"> Aiden Markram</label>
<label><input type="radio" name="q2" value="Finn Allen"> Finn Allen</label>
<label><input type="radio" name="q2" value="Quinton de Kock"> Quinton de Kock</label>
</div>

<div class="question">
<h3>3. Who was the Player of the Tournament in the 2024 T20 World Cup?</h3>

<label><input type="radio" name="q3" value="Suryakumar Yadav"> Suryakumar Yadav</label>
<label><input type="radio" name="q3" value="Jasprit Bumrah"> Jasprit Bumrah</label>
<label><input type="radio" name="q3" value="David Miller"> David Miller</label>
<label><input type="radio" name="q3" value="Shubman Gill"> Shubman Gill</label>
</div>

<button type="button" onclick="checkQuiz()">Submit Quiz</button>

</form>

<div id="result"></div>

</div>

<script>
function checkQuiz(){

let score=0;

let q1=document.querySelector('input[name="q1"]:checked');
let q2=document.querySelector('input[name="q2"]:checked');
let q3=document.querySelector('input[name="q3"]:checked');

if(!q1 || !q2 || !q3){
document.getElementById("result").innerHTML="❗Please answer every question.";
return;
}

if(q1.value=="David Miller") score++;
if(q2.value=="Finn Allen") score++;
if(q3.value=="Jasprit Bumrah") score++;

let message="";

if(score==3)
message="🏆 Perfect! 3/3";
else if(score==2)
message="⭐ Great! 2/3";
else if(score==1)
message="🙂 You scored 1/3";
else
message="😢 You scored 0/3";

document.getElementById("result").innerHTML=message;

}
</script>

</body>
</html>
